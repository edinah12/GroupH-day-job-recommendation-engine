{% extends "base.html" %}

{% block title %}Complete Profile{% endblock %}

{% block content %}

<div class="container py-5 max-w-2xl">
    <div class="card card-auth p-4 p-sm-5">
        <div class="text-center mb-4">
            <div class="icon-box bg-primary-subtle text-primary mb-3 mx-auto">
                <i class="bi bi-person-vcard fs-3"></i>
            </div>
            <h1 class="h3 fw-bold mb-1">Complete Your Profile</h1>
            <p class="text-muted small">Add your skills and experience to unlock personalized job recommendations.</p>
        </div>

        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {% include "profile/_form_fields.html" %}
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill mt-4 fw-semibold shadow">
                Save & Get Recommended Jobs <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>
    </div>
</div>

{% endblock %}
