{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card card-auth p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="icon-box bg-primary-subtle text-primary mb-3 mx-auto">
                        <i class="bi bi-key fs-3"></i>
                    </div>
                    <h1 class="h3 fw-bold mb-1">Reset Password</h1>
                    <p class="text-muted small">Enter your account email to receive reset instructions.</p>
                </div>

                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="id_email">Email address</label>
                        <input type="email" name="email" id="id_email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill mt-3 fw-semibold">
                        Send Reset Link
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <a href="{% url 'login' %}" class="small text-muted text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
