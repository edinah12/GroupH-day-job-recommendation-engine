{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3">
  {% for message in messages %}
  <div class="toast align-items-center border-0
               {% if message.tags == 'success' %}bg-success
               {% elif message.tags == 'error' or message.tags == 'danger' %}bg-danger
               {% elif message.tags == 'warning' %}bg-warning
               {% else %}bg-primary{% endif %}
               text-white"
       role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body d-flex align-items-center gap-2">
        <i class="bi
          {% if message.tags == 'success' %}bi-check-circle-fill
          {% elif message.tags == 'error' or message.tags == 'danger' %}bi-x-circle-fill
          {% elif message.tags == 'warning' %}bi-exclamation-triangle-fill
          {% else %}bi-info-circle-fill{% endif %}"></i>
        {{ message }}
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto"
              data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
  {% endfor %}
</div>
{% endif %}
