<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% block meta_description %}Find your perfect job with AI-powered recommendations tailored to your skills and experience.{% endblock %}" />
  <title>{% block title %}JobMatch{% endblock %} — Job Recommendation Engine</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons 1.11 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <style>
    /* ── Design tokens ──────────────────────────────────────── */
    :root {
      --clr-primary:      #0A2463;
      --clr-primary-lt:   #1a3a7c;
      --clr-accent:       #3E92CC;
      --clr-accent-lt:    #60aade;
      --clr-success:      #2DC653;
      --clr-warning:      #F4A261;
      --clr-danger:       #E63946;
      --clr-bg:           #F4F7FE;
      --clr-surface:      #FFFFFF;
      --clr-text:         #1A1A2E;
      --clr-text-muted:   #64748B;
      --clr-border:       #E2E8F0;
      --radius-card:      14px;
      --radius-btn:       8px;
      --radius-pill:      50px;
      --shadow-sm:        0 2px 8px rgba(10,36,99,.07);
      --shadow-md:        0 8px 24px rgba(10,36,99,.10);
      --shadow-lg:        0 20px 48px rgba(10,36,99,.13);
      --transition:       0.2s ease;
    }

    /* ── Global reset & typography ──────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--clr-bg);
      color: var(--clr-text);
      font-size: 0.9375rem;
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main { flex: 1; }

    h1, h2, h3, h4, h5, h6 {
      font-weight: 700;
      line-height: 1.25;
      color: var(--clr-text);
    }

    a { color: var(--clr-accent); transition: color var(--transition); }
    a:hover { color: var(--clr-primary); }

    /* ── Sticky navbar ──────────────────────────────────────── */
    .app-navbar {
      background: var(--clr-primary) !important;
      box-shadow: 0 2px 12px rgba(10,36,99,.18);
      position: sticky;
      top: 0;
      z-index: 1030;
      padding: 0.65rem 0;
    }

    .app-navbar .navbar-brand {
      font-weight: 800;
      font-size: 1.2rem;
      color: #fff !important;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      letter-spacing: -0.3px;
    }

    .app-navbar .navbar-brand .brand-icon {
      background: var(--clr-accent);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .app-navbar .nav-link {
      color: rgba(255,255,255,.82) !important;
      font-weight: 500;
      font-size: 0.875rem;
      padding: 0.45rem 0.85rem !important;
      border-radius: 7px;
      transition: background var(--transition), color var(--transition);
    }

    .app-navbar .nav-link:hover,
    .app-navbar .nav-link.active {
      background: rgba(255,255,255,.12);
      color: #fff !important;
    }

    .app-navbar .nav-link i { margin-right: 4px; }

    /* avatar pill */
    .nav-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--clr-accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .navbar-toggler { border-color: rgba(255,255,255,.3); }
    .navbar-toggler-icon { filter: invert(1); }

    /* ── Cards ──────────────────────────────────────────────── */
    .card {
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-sm);
      background: var(--clr-surface);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    /* ── Buttons ────────────────────────────────────────────── */
    .btn {
      font-weight: 600;
      border-radius: var(--radius-btn);
      transition: all var(--transition);
      font-size: 0.875rem;
    }

    .btn-primary {
      background: var(--clr-primary);
      border-color: var(--clr-primary);
    }
    .btn-primary:hover {
      background: var(--clr-primary-lt);
      border-color: var(--clr-primary-lt);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(10,36,99,.25);
    }

    .btn-accent {
      background: var(--clr-accent);
      border-color: var(--clr-accent);
      color: #fff;
    }
    .btn-accent:hover {
      background: var(--clr-accent-lt);
      border-color: var(--clr-accent-lt);
      color: #fff;
      transform: translateY(-1px);
    }

    .btn-outline-primary {
      border-color: var(--clr-primary);
      color: var(--clr-primary);
    }
    .btn-outline-primary:hover {
      background: var(--clr-primary);
      color: #fff;
      transform: translateY(-1px);
    }

    /* ── Form controls ──────────────────────────────────────── */
    .form-control, .form-select {
      border-radius: var(--radius-btn);
      border-color: var(--clr-border);
      font-size: 0.9rem;
      padding: 0.6rem 0.9rem;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--clr-accent);
      box-shadow: 0 0 0 3px rgba(62,146,204,.18);
    }

    .form-label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--clr-text);
      margin-bottom: 0.35rem;
    }

    /* ── Badges ─────────────────────────────────────────────── */
    .badge { font-weight: 600; letter-spacing: 0.2px; }

    /* ── Job-type pill colours ──────────────────────────────── */
    .pill-fulltime  { background:#dbeafe; color:#1e40af; }
    .pill-parttime  { background:#fef3c7; color:#92400e; }
    .pill-remote    { background:#d1fae5; color:#065f46; }
    .pill-contract  { background:#ede9fe; color:#5b21b6; }
    .pill-internship{ background:#fee2e2; color:#991b1b; }

    /* ── Section headings ───────────────────────────────────── */
    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--clr-accent);
      margin-bottom: 0.35rem;
    }

    /* ── Alerts ─────────────────────────────────────────────── */
    .alert { border-radius: var(--radius-card); border: none; font-size: 0.88rem; }
    .alert-success { background:#d1fae5; color:#065f46; }
    .alert-danger  { background:#fee2e2; color:#991b1b; }
    .alert-info    { background:#dbeafe; color:#1e40af; }
    .alert-warning { background:#fef3c7; color:#92400e; }

    /* ── Footer ─────────────────────────────────────────────── */
    .app-footer {
      background: var(--clr-primary);
      color: rgba(255,255,255,.7);
      padding: 2.5rem 0 1.5rem;
      margin-top: auto;
    }

    .app-footer a { color: rgba(255,255,255,.7); text-decoration: none; }
    .app-footer a:hover { color: #fff; }
    .app-footer .footer-brand { font-weight: 800; color: #fff; font-size: 1.1rem; }
    .app-footer .footer-divider { border-color: rgba(255,255,255,.12); margin: 1.5rem 0 1rem; }

    /* ── Toast container ────────────────────────────────────── */
    .toast-container { z-index: 1090; }

    /* ── Utility ────────────────────────────────────────────── */
    .text-primary { color: var(--clr-primary) !important; }
    .text-accent  { color: var(--clr-accent)  !important; }
    .text-muted   { color: var(--clr-text-muted) !important; }
    .bg-primary   { background: var(--clr-primary) !important; }
    .bg-surface   { background: var(--clr-surface) !important; }
    .bg-app       { background: var(--clr-bg) !important; }
    .rounded-card { border-radius: var(--radius-card) !important; }
    .shadow-card  { box-shadow: var(--shadow-md) !important; }

    /* ── Scrollbar ──────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--clr-bg); }
    ::-webkit-scrollbar-thumb { background: var(--clr-border); border-radius: 4px; }

    /* ── Extra block for page-level overrides ───────────────── */
    {% block extra_css %}{% endblock %}
  </style>
</head>

<body>

  <!-- ── Navbar ───────────────────────────────────────────────── -->
  {% include "partials/navbar.html" %}

  <!-- ── Django messages → toasts ─────────────────────────────── -->
  {% include "partials/messages.html" %}

  <!-- ── Page content ─────────────────────────────────────────── -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ───────────────────────────────────────────────── -->
  {% include "partials/footer.html" %}

  <!-- ── Bootstrap JS ─────────────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ── Toast auto-show ──────────────────────────────────────── -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.toast').forEach(el => {
        new bootstrap.Toast(el, { delay: 4500 }).show();
      });
    });
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
