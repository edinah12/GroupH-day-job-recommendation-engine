{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}

<div class="container py-5 max-w-2xl">
    <div class="card card-auth p-4 p-sm-5">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <div>
                <h1 class="h3 fw-bold mb-1">Edit Profile</h1>
                <p class="text-muted small mb-0">Update your background and skill recommendations.</p>
            </div>
            <a href="{% url 'view_profile' %}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                Cancel
            </a>
        </div>

        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {% include "profile/_form_fields.html" %}
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill mt-4 fw-semibold shadow-sm">
                <i class="bi bi-check-circle me-1"></i> Save Changes
            </button>
        </form>
    </div>
</div>

{% endblock %}
